name: Build Pulse Terminal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q PulseTerminal_Android_V1.zip -d project

      - name: Build Debug APK
        working-directory: project/PulseTerminal_Android_V1
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseTerminal-APK
          path: project/PulseTerminal_Android_V1/app/build/outputs/apk/debug/app-debug.apk
